services:
  sleeper-coach:
    build: .
    container_name: sleeper-coach
    # Ports bound to loopback only; exposed publicly via nginx + Authelia.
    ports:
      - "127.0.0.1:8770:8770" # dashboard (Phase D)
      - "127.0.0.1:6081:6080" # noVNC (takeover view)
    volumes:
      - /data/sleeper-coach:/data/sleeper-coach
    env_file: /data/sleeper-coach/env
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # Discord voice bot that speaks the coach's draft picks. Shares the data volume
  # READ-ONLY (it only tails activity.jsonl) and joins the same default compose
  # network. restart: on-failure means a clean exit when the Discord env is
  # unset (see src/announcer/index.ts) stays down instead of crash-looping.
  announcer:
    build:
      context: .
      dockerfile: Dockerfile.announcer
    container_name: sleeper-announcer
    # No depends_on the coach: the announcer only tails a file on the shared
    # volume, and a depends_on made `up announcer` recreate the coach mid-draft.
    volumes:
      - /data/sleeper-coach:/data/sleeper-coach:ro
    env_file: /data/sleeper-coach/env
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
