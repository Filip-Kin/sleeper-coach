<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Coach</title>
<style>
  :root {
    --bg: #121316; --panel: #191b1f; --panel2: #212429; --line: #2a2e35;
    --text: #e7e9ee; --muted: #9aa1ad; --accent: #7c8cff; --good: #46c78a;
    --warn: #e0a63b; --bad: #e5675f; --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 18px;
    border-bottom: 1px solid var(--line); background: var(--panel); }
  header .team { font-weight: 650; font-size: 17px; }
  header .sub { color: var(--muted); font-size: 13px; }
  .pill { margin-left: auto; font-size: 12px; padding: 4px 10px; border-radius: 999px;
    background: var(--panel2); border: 1px solid var(--line); color: var(--muted); }
  .pill.live { color: var(--good); border-color: var(--good); }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 14px; height: calc(100vh - 58px); }
  .col { display: flex; flex-direction: column; min-height: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .card h2 { margin: 0; padding: 11px 14px; font-size: 13px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--line); }
  /* console */
  #stream { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { white-space: pre-wrap; }
  .msg.you { color: var(--accent); }
  .msg.think { border-left: 2px solid var(--accent); padding-left: 10px; color: var(--text); }
  .tool { font-family: var(--mono); font-size: 12.5px; background: var(--panel2);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .tool .cmd { color: var(--good); }
  .tool .out { color: var(--muted); margin-top: 6px; max-height: 140px; overflow: auto; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  input[type=text] { flex: 1; background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 12px; font-size: 14px; }
  button { background: var(--accent); color: #0b0c10; border: 0; border-radius: 8px;
    padding: 0 16px; font-weight: 600; cursor: pointer; }
  button.ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--line); }
  /* tabs */
  .tabs { display: flex; gap: 6px; padding: 10px 12px 0; }
  .tabs button { background: var(--panel2); color: var(--muted); border: 1px solid var(--line);
    padding: 6px 12px; font-weight: 500; font-size: 13px; }
  .tabs button.on { color: var(--text); border-color: var(--accent); }
  .tabwrap { flex: 1; overflow: auto; padding: 6px 4px 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; position: sticky; top: 0; background: var(--panel); }
  td.num { text-align: right; font-family: var(--mono); }
  .tier { color: var(--muted); }
  .inj { color: var(--warn); font-size: 11px; }
  .act { border-bottom: 1px solid var(--line); padding: 10px 12px; }
  .act-head { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
  .badge { text-transform: uppercase; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: var(--panel2); }
  .badge.coach { color: #0b0c10; background: var(--accent); }
  .badge.engineer { color: #0b0c10; background: var(--warn); }
  .badge.daemon, .badge.system { color: var(--muted); }
  .act-type { font-family: var(--mono); }
  .act-time { margin-left: auto; }
  .act-sum { margin-top: 4px; font-size: 13.5px; }
  .reason { margin-top: 4px; color: var(--muted); font-style: italic; font-size: 12.5px; }
  .act-line { border-bottom: 1px solid var(--line); padding: 8px 2px; }
  .act-line .badge { margin-right: 6px; }
  .act-line .act-type { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .act-line .act-time { float: right; color: var(--muted); font-size: 11px; }
  .board-peek { margin-top: 4px; font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: normal; }
  .cv-target { color: var(--good); font-weight: 600; }
  iframe { width: 100%; height: 100%; border: 0; background: #000; }
  .status { padding: 8px 14px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); }
  /* live guidance channel (Problem 1) */
  .gbar { padding: 9px 12px; border-top: 1px solid var(--line); background: var(--panel2); font-size: 12.5px; }
  .gbar .lbl { color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-size: 10.5px; }
  .gbar .cur { margin-top: 3px; color: var(--text); white-space: pre-wrap; }
  .gbar .cur.none { color: var(--muted); font-style: italic; }
  .gbar .clr { color: var(--accent); cursor: pointer; float: right; font-size: 11px; }
  .gbar.dead { color: var(--bad); }
  .mode { display: flex; gap: 6px; padding: 10px 12px 0; }
  .mode button { background: var(--panel2); color: var(--muted); border: 1px solid var(--line); padding: 5px 11px; font-size: 12px; font-weight: 500; }
  .mode button.on { color: var(--text); border-color: var(--accent); }
  .gnote { padding: 4px 12px 10px; color: var(--muted); font-size: 11.5px; }
  .gnote.warn { color: var(--warn); }
  /* draft plan tab (Problem 2) */
  .dv-sec { padding: 6px 4px 14px; }
  .dv-sec h3 { margin: 10px 8px 6px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  .dv-cap { margin: 0 8px 6px; color: var(--muted); font-size: 11.5px; }
  .age { margin: 6px 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel2); display: flex; align-items: baseline; gap: 10px; }
  .age .state { font-weight: 700; text-transform: uppercase; letter-spacing: .05em; font-size: 11px; padding: 3px 8px; border-radius: 6px; align-self: center; }
  .age .n { font-family: var(--mono); font-size: 30px; font-weight: 700; line-height: 1; }
  .age .u { color: var(--muted); font-size: 12px; }
  .age .note { margin-left: auto; text-align: right; color: var(--muted); font-size: 11px; max-width: 52%; }
  /* State past 45s must read at a glance: a 116s stale plan caused the one bad
     pick on 30 Aug and was invisible as a bare number. Tint the whole box and
     pulse when stale, not just the digits. */
  .age.fresh { border-color: var(--good); }
  .age.fresh .n { color: var(--good); }
  .age.fresh .state { color: #0b0c10; background: var(--good); }
  .age.aging { border-color: var(--warn); }
  .age.aging .n { color: var(--warn); }
  .age.aging .state { color: #0b0c10; background: var(--warn); }
  .age.stale { border-color: var(--bad); background: rgba(229,103,95,.12); animation: stalepulse 1.1s ease-in-out infinite; }
  .age.stale .n { color: var(--bad); }
  .age.stale .state { color: #0b0c10; background: var(--bad); }
  @keyframes stalepulse { 0%,100% { box-shadow: 0 0 0 0 rgba(229,103,95,0); } 50% { box-shadow: 0 0 0 3px rgba(229,103,95,.28); } }
  @media (prefers-reduced-motion: reduce) { .age.stale { animation: none; } }
  .banner { margin: 6px 8px; padding: 8px 11px; border-radius: 8px; font-size: 12px; border: 1px solid var(--line); color: var(--muted); }
  .banner.live { border-color: var(--good); color: var(--good); }
  td.gone { color: var(--muted); text-decoration: line-through; }
  .ntag { font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 4px; margin-left: 5px; }
  .ntag.out, .ntag.risk { color: #0b0c10; background: var(--bad); }
  .ntag.watch { color: #0b0c10; background: var(--warn); }
  .ntag.soft { color: var(--muted); background: var(--panel2); border: 1px solid var(--line); }
  .chip { display: inline-block; margin: 3px 4px 0 0; padding: 3px 8px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); font-size: 12px; }
  .chip .p { color: var(--muted); font-size: 11px; margin-left: 4px; }
  .bye-row td.heavy { color: var(--bad); font-weight: 700; }
  .ovr { border-bottom: 1px solid var(--line); padding: 9px 8px; font-size: 12.5px; }
  .ovr .h { display: flex; gap: 8px; align-items: baseline; }
  .ovr .took { color: var(--good); font-weight: 600; }
  .ovr .vs { color: var(--muted); }
  .ovr .board { color: var(--text); }
  .ovr .gap { font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-left: auto; }
  .ovr .caveat { margin-top: 3px; color: var(--warn); font-size: 11px; }
  .ovr .reason { font-style: italic; }
</style>
</head>
<body>
<header>
  <div>
    <div class="team" id="teamName">Coach</div>
    <div class="sub" id="leagueSub">connecting…</div>
  </div>
  <div class="pill" id="statusPill">–</div>
</header>
<main>
  <div class="col">
    <div class="card" style="flex:1">
      <h2>Coach console: live reasoning</h2>
      <div id="stream"></div>
      <div class="gbar" id="guidanceBar"><span class="lbl">guidance loading…</span></div>
      <form id="chatForm">
        <div class="mode">
          <button type="button" id="modeGuide" class="on" title="Reaches the running draft agent">Guide the draft</button>
          <button type="button" id="modeAsk" title="One-off question; does not steer the live pick">Ask (off-draft)</button>
        </div>
        <div style="display:flex;gap:8px;padding:10px 12px 0">
          <input type="text" id="chatInput" placeholder="Guidance for the draft agent, e.g. we have enough RBs, take receivers" autocomplete="off" />
          <button type="submit" id="sendBtn">Apply</button>
          <button type="button" class="ghost" id="newBtn" title="New conversation (Ask mode)">New</button>
        </div>
        <div class="gnote" id="modeNote"></div>
      </form>
      <div class="status" id="agentStatus">idle</div>
    </div>
  </div>
  <div class="col">
    <div class="card" style="flex:1">
      <div class="tabs">
        <button data-tab="plan" class="on">Draft plan</button>
        <button data-tab="coachview">Coach view</button>
        <button data-tab="board">Value board</button>
        <button data-tab="roster">My roster</button>
        <button data-tab="activity">Activity</button>
        <button id="takeoverBtn" title="Open the browser takeover in a new tab">Takeover ↗</button>
      </div>
      <div class="tabwrap" id="tab-plan"></div>
      <div class="tabwrap" id="tab-coachview" style="display:none"></div>
      <div class="tabwrap" id="tab-board" style="display:none"></div>
      <div class="tabwrap" id="tab-roster" style="display:none"></div>
      <div class="tabwrap" id="tab-activity" style="display:none"></div>
    </div>
  </div>
</main>
<script type="module">
const $ = (s) => document.querySelector(s);
const stream = $("#stream");
let sessionId = localStorage.getItem("coach-session") || null;
let novncUrl = null;

function addMsg(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  stream.appendChild(d); stream.scrollTop = stream.scrollHeight;
  return d;
}
function addTool(name, input) {
  const d = document.createElement("div");
  d.className = "tool";
  d.innerHTML = `<div class="cmd">$ ${name} ${escapeHtml(input)}</div><div class="out"></div>`;
  stream.appendChild(d); stream.scrollTop = stream.scrollHeight;
  return d;
}
function escapeHtml(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

let curAssistant = null;
const toolBoxes = {};
function handleEvent(ev) {
  if (ev.type === "assistant" && ev.message?.content) {
    for (const b of ev.message.content) {
      if (b.type === "text" && b.text) curAssistant = addMsg("bot", b.text);
      if (b.type === "tool_use") {
        const inp = b.input?.command || JSON.stringify(b.input||{});
        toolBoxes[b.id] = addTool(b.name || "tool", inp);
      }
    }
  } else if (ev.type === "user" && ev.message?.content) {
    for (const b of ev.message.content) {
      if (b.type === "tool_result" && toolBoxes[b.tool_use_id]) {
        const out = Array.isArray(b.content) ? b.content.map(c=>c.text||"").join("") : (b.content||"");
        toolBoxes[b.tool_use_id].querySelector(".out").textContent = String(out).slice(0, 1200);
      }
    }
  }
}

async function send(message) {
  $("#agentStatus").textContent = "thinking…";
  $("#sendBtn").disabled = true;
  addMsg("you", message);
  const res = await fetch("/api/chat", { method: "POST", headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ message, sessionId }) });
  const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = "";
  for (;;) {
    const { value, done } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    let i; while ((i = buf.indexOf("\n\n")) !== -1) {
      const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
      const ev = chunk.split("\n").find(l=>l.startsWith("event:"))?.slice(6).trim();
      const data = chunk.split("\n").find(l=>l.startsWith("data:"))?.slice(5).trim();
      if (!data) continue;
      const payload = JSON.parse(data);
      if (ev === "session" && payload.sessionId) { sessionId = payload.sessionId; localStorage.setItem("coach-session", sessionId); }
      else if (ev === "message") handleEvent(payload);
      else if (ev === "done") { sessionId = payload.sessionId; localStorage.setItem("coach-session", sessionId); }
      else if (ev === "error") addMsg("bot", "⚠ " + payload.message);
    }
  }
  $("#agentStatus").textContent = "idle"; $("#sendBtn").disabled = false;
}

// #region guidance channel (Problem 1)
// The console input has two honestly-separated modes. "Guide the draft" writes
// through the mechanism that actually reaches a running draft: it rebuilds the
// agent's system prompt from the pristine base, so the guidance lands on the
// agent's next plan refresh (~20s). "Ask" is the old one-off chat, which streams
// reasoning but does NOT steer the live pick, which is exactly why the box felt
// broken on 30 Aug when used mid-draft.
let mode = "guide";
function setMode(m) {
  mode = m;
  $("#modeGuide").classList.toggle("on", m === "guide");
  $("#modeAsk").classList.toggle("on", m === "ask");
  $("#chatInput").placeholder = m === "guide"
    ? "Guidance for the draft agent, e.g. we have enough RBs, take receivers"
    : "Ask the coach a one-off question…";
  $("#sendBtn").textContent = m === "guide" ? "Apply" : "Send";
  const note = $("#modeNote");
  if (m === "guide") { note.className = "gnote warn";
    note.textContent = "Applies from the agent's next plan refresh (about 20s). It will NOT change a pick already on the clock, and a stale plan bypasses it entirely."; }
  else { note.className = "gnote";
    note.textContent = "One-off question. Streams the coach's reasoning but does not steer the live draft pick; use Guide for that."; }
}
$("#modeGuide").addEventListener("click", () => setMode("guide"));
$("#modeAsk").addEventListener("click", () => setMode("ask"));
setMode("guide");

async function loadGuidance() {
  const bar = $("#guidanceBar");
  try {
    const g = await (await fetch("/api/guidance")).json();
    if (g.error) { bar.className = "gbar dead"; bar.innerHTML = `<span class="lbl">guidance unavailable:</span> ${escapeHtml(g.error)}`; return; }
    if (!g.baseReadable) { bar.className = "gbar dead";
      bar.innerHTML = `<span class="lbl">guidance channel unavailable</span><div class="cur none">${escapeHtml(g.reason || "The pristine base prompt could not be resolved, so guidance cannot be applied safely.")}</div>`; return; }
    bar.className = "gbar";
    if (g.active) {
      bar.innerHTML = `<span class="clr" id="clrGuidance">clear</span><span class="lbl">guidance in effect (reaches the agent next refresh)</span>`
        + `<div class="cur">${escapeHtml(g.inEffect)}</div>`;
      $("#clrGuidance").addEventListener("click", () => applyGuidance("", true));
      if (mode === "guide" && !$("#chatInput").value) $("#chatInput").value = g.inEffect;
    } else {
      bar.innerHTML = `<span class="lbl">no live guidance set</span><div class="cur none">The agent is following its base strategy. Type guidance below to override it from the next refresh.</div>`;
    }
  } catch (e) { bar.className = "gbar dead"; bar.innerHTML = `<span class="lbl">guidance load error</span>`; }
}
async function applyGuidance(text, isClear) {
  $("#sendBtn").disabled = true;
  try {
    const g = await (await fetch("/api/guidance", { method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ guidance: text }) })).json();
    if (g.error) { addMsg("bot", "⚠ guidance not applied: " + g.error); }
    else {
      addMsg("you", isClear ? "· cleared draft guidance" : "· set draft guidance: " + text);
      addMsg("bot", isClear ? "Guidance cleared. The agent returns to its base strategy on its next refresh (~20s)."
        : "Guidance applied. It reaches the agent on its next plan refresh (~20s) and will not change a pick already on the clock.");
      if (isClear) $("#chatInput").value = "";
    }
  } catch (e) { addMsg("bot", "⚠ guidance request failed: " + e); }
  $("#sendBtn").disabled = false;
  loadGuidance();
}
// #endregion

$("#chatForm").addEventListener("submit", (e) => { e.preventDefault();
  const v = $("#chatInput").value.trim(); if (!v) return;
  if (mode === "guide") { applyGuidance(v, false); }
  else { $("#chatInput").value = ""; send(v); } });
$("#newBtn").addEventListener("click", () => { sessionId = null; localStorage.removeItem("coach-session"); stream.innerHTML=""; setMode("ask"); });

// tabs (Takeover is not a tab; it opens the noVNC view in a new tab)
document.querySelectorAll(".tabs button[data-tab]").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".tabs button[data-tab]").forEach(x=>x.classList.remove("on")); b.classList.add("on");
  for (const t of ["plan","coachview","board","roster","activity"]) $("#tab-"+t).style.display = (t===b.dataset.tab)?"":"none";
  if (b.dataset.tab === "activity") renderActivity();
  if (b.dataset.tab === "plan") renderDraftView();
}));

// #region live activity stream (SSE tail of the activity log)
// Everything the coach and engineer log lands here in real time: plans, picks,
// board reads, errors, so the draft is watchable live, not just in hindsight.
const seenKeys = new Set();
function evKey(ev){ return ev.ts + "|" + ev.type + "|" + (ev.summary || (ev.text||"").slice(0,50)); }
function addActivity(ev) {
  const k = evKey(ev); if (seenKeys.has(k)) return; seenKeys.add(k);
  if (seenKeys.size > 600) seenKeys.clear();
  // The model's live reasoning streams as "think" events, render as flowing
  // console text, the way the interactive chat shows the coach's own output.
  if (ev.type === "think") {
    const d = document.createElement("div");
    d.className = "msg bot think";
    d.textContent = ev.text || "";
    stream.appendChild(d); stream.scrollTop = stream.scrollHeight;
    return;
  }
  // A board read updates the Coach view panel (what the AI thinks is available).
  if (ev.type === "board" && ev.detail) renderCoachView(ev.detail);
  const d = document.createElement("div");
  d.className = "act-line";
  const time = new Date(ev.ts).toLocaleTimeString();
  let extra = "";
  if (ev.detail && ev.detail.reasoning) extra += `<div class="reason">“${escapeHtml(ev.detail.reasoning)}”</div>`;
  if (ev.detail && Array.isArray(ev.detail.available))
    extra += `<div class="board-peek">sees: ${ev.detail.available.slice(0,12).map(a=>escapeHtml(a.name?`${a.name}${a.pos?` ${a.pos}`:""}`:String(a))).join(" · ")}</div>`;
  d.innerHTML = `<span class="act-time">${time}</span><span class="badge ${ev.actor}">${ev.actor}</span>`
    + `<span class="act-type">${escapeHtml(ev.type)}</span><div class="act-sum">${escapeHtml(ev.summary)}</div>${extra}`;
  stream.appendChild(d); stream.scrollTop = stream.scrollHeight;
}
let lastCoachView = null;
function renderCoachView(detail) {
  lastCoachView = detail;
  const avail = Array.isArray(detail.available) ? detail.available : [];
  const head = `<div style="padding:8px 10px;color:var(--muted);font-size:12px">`
    + `Pick ${detail.pickNo ?? "–"} · Round ${detail.round ?? "–"}`
    + (detail.target ? ` · target <span class="cv-target">${escapeHtml(detail.target)}</span>` : "")
    + ` · ${avail.length} seen available</div>`
    + (detail.reasoning ? `<div class="reason" style="padding:0 10px 8px">“${escapeHtml(detail.reasoning)}”</div>` : "");
  const rows = avail.map((a,i)=>`<tr><td class="num">${i+1}</td><td>${escapeHtml(a.name||String(a))}</td><td>${escapeHtml(a.pos||"")}</td></tr>`).join("");
  $("#tab-coachview").innerHTML = head + (rows
    ? `<table><thead><tr><th>#</th><th>Player (as read from the draft room)</th><th>Pos</th></tr></thead><tbody>${rows}</tbody></table>`
    : `<p style='color:var(--muted);padding:14px'>No live board read yet. This fills in when a draft is running; it's exactly what the coach sees as still-available.</p>`);
}
renderCoachView({});
function connectStream() {
  const es = new EventSource("/api/stream");
  es.addEventListener("event", (e) => { try { addActivity(JSON.parse(e.data)); } catch {} });
  es.onerror = () => { /* EventSource auto-reconnects */ };
}
connectStream();
// #endregion

async function renderActivity() {
  try {
    const s = await (await fetch("/api/activity")).json();
    const evs = (s.events || []).slice().reverse();
    $("#tab-activity").innerHTML = evs.length ? evs.map(e => {
      const t = new Date(e.ts).toLocaleString();
      const reason = e.detail && e.detail.reasoning ? `<div class="reason">“${escapeHtml(e.detail.reasoning)}”</div>` : "";
      return `<div class="act"><div class="act-head"><span class="badge ${e.actor}">${e.actor}</span>`
        + `<span class="act-type">${escapeHtml(e.type)}</span><span class="act-time">${t}</span></div>`
        + `<div class="act-sum">${escapeHtml(e.summary)}</div>${reason}</div>`;
    }).join("") : "<p style='color:var(--muted);padding:14px'>No activity yet. The coach and engineer log everything here.</p>";
  } catch (e) { $("#tab-activity").innerHTML = "<p style='color:var(--bad);padding:14px'>activity error</p>"; }
}
$("#takeoverBtn").addEventListener("click", () => {
  window.open(novncUrl || "https://coach-vnc.filipkin.com/vnc.html?autoconnect=1&resize=scale", "_blank");
});

// #region draft plan view (Problem 2): what the coach is about to do
// Read-only, off the Sleeper API + the engine's own log. Plan AGE is the headline
// because a 116-second-stale plan is what caused the one bad pick on 30 Aug and
// it was invisible at the time. We tick the age every second from the plan's log
// timestamp so staleness is impossible to miss.
let planTs = null; // ms epoch of the current plan, or null
function fmt(n, d = 1) { return (n === null || n === undefined) ? "–" : Number(n).toFixed(d); }
function newsTag(n) { return n ? ` <span class="ntag ${n.status}" title="${escapeHtml(n.note)}">${n.status}</span>` : ""; }
function renderAge() {
  const box = $("#ageBox"); if (!box) return;
  if (planTs === null) { box.className = "age";
    box.innerHTML = `<span class="state" style="color:var(--muted);background:var(--panel)">no plan</span><span class="n">–</span><span class="u">nothing logged yet</span>`; return; }
  const s = Math.max(0, Math.round((Date.now() - planTs) / 1000));
  // 45s is the postmortem's "treat as absent" threshold; the bad pick's plan was 116s old.
  const cls = s < 30 ? "fresh" : s < 45 ? "aging" : "stale";
  const word = s < 30 ? "fresh" : s < 45 ? "ageing" : "stale";
  const disp = s < 600 ? `${s}` : `${Math.round(s/60)}`;
  const unit = s < 600 ? "seconds old" : "minutes old";
  const note = cls === "stale"
    ? "Past 45s the engine treats the plan as absent and picks off the raw value board, where your guidance has no effect. The bad pick on 30 Aug ran on a 116s plan."
    : "Plans refresh about every 20s off the clock. At 45s the plan is treated as stale and the engine falls back to the raw value board.";
  box.className = "age " + cls;
  box.innerHTML = `<span class="state">${word}</span><span class="n">${disp}</span><span class="u">${unit}</span><span class="note">${note}</span>`;
}
setInterval(renderAge, 1000);

async function renderDraftView() {
  const el = $("#tab-plan");
  let d;
  try { d = await (await fetch("/api/draftview")).json(); }
  catch (e) { el.innerHTML = `<p style='color:var(--bad);padding:14px'>draft view error: ${escapeHtml(String(e))}</p>`; return; }
  if (d.error) { el.innerHTML = `<p style='color:var(--bad);padding:14px'>draft view error: ${escapeHtml(d.error)}</p>`; return; }

  planTs = d.plan && d.plan.ts ? Date.parse(d.plan.ts) : null;
  const ctx = d.context || {};
  const banner = d.draftLive
    ? `<div class="banner live">Draft LIVE · our slot ${ctx.slot ?? "?"} · round ${ctx.round ?? "?"} · ${ctx.ourCount ?? 0} of ${ctx.rounds ?? "?"} picks made</div>`
    : `<div class="banner">No draft in progress (status: ${escapeHtml(d.draftStatus||"?")}). Showing the last recorded plan; its age is measured from when it was logged.</div>`;

  // Plan age + plan table
  let planHtml = `<div class="age" id="ageBox"></div>`;
  if (d.plan && d.plan.isError) {
    planHtml += `<div class="dv-cap" style="color:var(--bad)">Last plan FAILED: ${escapeHtml(d.plan.error||"agent unavailable")}, the engine was drafting off the raw value board.</div>`;
  }
  if (d.plan && d.plan.reasoning) planHtml += `<div class="reason" style="padding:0 8px 6px">“${escapeHtml(d.plan.reasoning)}”</div>`;
  planHtml += `<div class="dv-cap">Order and reasoning are the engine's own. VOR, tier and news tags are exact. VONA and survival are recomputed live off the Sleeper picks feed (which lags a few picks in-draft), so treat them as an estimate.</div>`;
  const rows = (d.plan && d.plan.rows) || [];
  if (rows.length) {
    planHtml += `<table><thead><tr><th>#</th><th>Player</th><th>Pos</th><th>Tm</th><th class="num">VOR</th>`
      + `<th class="num">VONA</th><th class="num">Surv</th><th class="num">Bye</th></tr></thead><tbody>`
      + rows.map((r,i) => `<tr><td class="num">${i+1}</td>`
        + `<td class="${r.gone?"gone":""}" title="${r.gone?"already taken by a rival":""}">${escapeHtml(r.name)}${newsTag(r.news)}</td>`
        + `<td>${escapeHtml(r.pos)}</td><td>${escapeHtml(r.team)}</td>`
        + `<td class="num">${fmt(r.vor)}</td><td class="num">${fmt(r.vona)}</td>`
        + `<td class="num">${r.pSurvive===null||r.pSurvive===undefined?"–":Math.round(r.pSurvive*100)+"%"}</td>`
        + `<td class="num">${r.bye ?? "–"}</td></tr>`).join("")
      + `</tbody></table>`;
  } else {
    planHtml += `<p style='color:var(--muted);padding:14px'>No plan logged. This fills in once a draft is running.</p>`;
  }

  // Backstop queue
  const q = d.queue || [];
  const qCap = d.queueSource === "logged"
    ? `The exact queue the engine last pushed to Sleeper${d.queueTs ? `, at ${new Date(d.queueTs).toLocaleTimeString()}` : ""}. Never K/DEF: Sleeper autopicks down the queue and would surface a defence too early.`
    : "The engine has not logged a pushed queue yet, so this is rebuilt with its exact algorithm from current availability. Never K/DEF: Sleeper autopicks down the queue and would surface a defence too early.";
  let queueHtml = `<div class="dv-cap">${qCap}</div>`;
  queueHtml += q.length
    ? q.map(p => `<span class="chip">${escapeHtml(p.name)}<span class="p">${escapeHtml(p.pos)}${p.bye?` · bye ${p.bye}`:""}</span></span>`).join("")
    : `<p style='color:var(--muted);padding:8px'>Queue empty (no live availability).</p>`;

  // Roster byes
  const byes = d.byes || [];
  let byeHtml = byes.length
    ? `<table><thead><tr><th>Bye week</th><th class="num">Players on it</th></tr></thead><tbody>`
      + byes.map(b => `<tr class="bye-row"><td class="${b.heavy?"heavy":""}">Week ${b.week}${b.heavy?" ⚠":""}</td><td class="num ${b.heavy?"heavy":""}">${b.count}</td></tr>`).join("")
      + `</tbody></table>`
    : `<p style='color:var(--muted);padding:8px'>No rostered players yet.</p>`;
  const heavy = byes.filter(b=>b.heavy);
  if (heavy.length) byeHtml = `<div class="dv-cap" style="color:var(--bad)">${heavy.map(b=>`${b.count} players share the week ${b.week} bye`).join("; ")}, the kind of hole that cost about 10.7 points in one week on 30 Aug.</div>` + byeHtml;

  // Overrides
  const ov = d.overrides || [];
  let ovHtml = ov.length ? ov.map(o => {
    const t = new Date(o.ts).toLocaleTimeString();
    let gap = "";
    if (!o.capped && (o.vonaGap !== null || o.vorGap !== null)) gap = `<span class="gap">VONA ${fmt(o.vonaGap)} · VOR ${fmt(o.vorGap)}</span>`;
    const caveat = o.capped
      ? `<div class="caveat">Board wanted ${escapeHtml(o.boardPos||"a")} (one-starter capped), so the raw VOR gap of ${fmt(o.vorGap)} is not a real cost: a kicker or defence taken early is worth almost nothing.</div>`
      : "";
    const reason = o.reasoning ? `<div class="reason" style="margin-top:3px;color:var(--muted)">“${escapeHtml(o.reasoning)}”</div>` : "";
    return `<div class="ovr"><div class="h"><span class="took">${escapeHtml(o.picked||"?")}</span>`
      + `<span class="vs">over the board's</span><span class="board">${escapeHtml(o.board||"?")}${o.boardPos?` (${escapeHtml(o.boardPos)})`:""}</span>${gap}</div>`
      + `<div style="color:var(--muted);font-size:11px;margin-top:2px">VONA rank ${o.vonaRank ?? "?"} · ${t}</div>${caveat}${reason}</div>`;
  }).join("") : `<p style='color:var(--muted);padding:8px'>No agent overrides logged yet.</p>`;

  el.innerHTML = banner
    + `<div class="dv-sec">${planHtml}</div>`
    + `<div class="dv-sec"><h3>Backstop queue ${d.queueSource === "logged" ? "(live)" : "(reconstructed)"}</h3>${queueHtml}</div>`
    + `<div class="dv-sec"><h3>Roster bye load</h3>${byeHtml}</div>`
    + `<div class="dv-sec"><h3>Recent agent overrides</h3>${ovHtml}</div>`;
  renderAge();
}
// #endregion

async function loadState() {
  try {
    const s = await (await fetch("/api/state")).json();
    $("#teamName").textContent = s.team?.name || "Coach";
    $("#leagueSub").textContent = `${s.league.name} · ${s.league.teams} teams · ${s.league.scoring.join(" · ")}`;
    const pill = $("#statusPill");
    pill.textContent = s.draft.status === "drafting" ? "DRAFT LIVE" : `draft: ${s.draft.status}`;
    pill.className = "pill" + (s.draft.status === "drafting" ? " live" : "");
    // board
    $("#tab-board").innerHTML = "<table><thead><tr><th>#</th><th>Player</th><th>Pos</th><th>Tm</th>"
      + "<th class='num'>Pts</th><th class='num'>VOR</th><th class='num'>ADP</th><th>Tier</th></tr></thead><tbody>"
      + s.board.map((r,i)=>`<tr><td class="num">${i+1}</td><td>${r.name}${r.injury?` <span class='inj'>${r.injury}</span>`:""}</td>`
      + `<td>${r.pos}</td><td>${r.team}</td><td class="num">${r.pts.toFixed(1)}</td><td class="num">${r.vor.toFixed(1)}</td>`
      + `<td class="num">${r.adp?r.adp.toFixed(1):"–"}</td><td class="tier">T${r.tier}</td></tr>`).join("") + "</tbody></table>";
    // roster
    $("#tab-roster").innerHTML = s.roster.length ? "<table><tbody>"
      + s.roster.map(p=>`<tr><td>${p.name}${p.injury?` <span class='inj'>${p.injury}</span>`:""}</td><td>${p.pos}</td><td>${p.team}</td></tr>`).join("")
      + "</tbody></table>" : "<p style='color:var(--muted);padding:14px'>Roster empty (pre-draft).</p>";
    // takeover opens this URL (with the VNC password baked in) in a new tab
    novncUrl = s.novncUrl;
  } catch (e) { $("#leagueSub").textContent = "state error: " + e; }
}
loadState();
loadGuidance();
renderDraftView();
setInterval(() => {
  loadState();
  loadGuidance();
  if ($("#tab-plan").style.display !== "none") renderDraftView();
  if ($("#tab-activity").style.display !== "none") renderActivity();
}, 15000);
// A plan can go stale between polls, so refresh the plan view faster while it's
// the open tab, the whole point being to catch a plan ageing past 45s live.
setInterval(() => { if ($("#tab-plan").style.display !== "none") renderDraftView(); }, 5000);
</script>
