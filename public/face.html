<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>the coach</title>
<!--
  The coach's face. Everything is drawn onto a 64x48 canvas and upscaled with
  image-rendering: pixelated, so the pixels are real pixels rather than a filter:
  the mouth quantises to the grid, which is what makes it read as deliberate
  pixel art instead of a smooth shape with a blur over it.

  The mouth is driven by src/announcer/envelope.ts, two numbers per 20ms:
  openness from RMS energy, wideness from zero-crossing rate. Sync comes from
  <audio>.currentTime, so the animation cannot drift from the sound.

  Query flags:
    ?mute=1   for someone already in the Discord call: silent video, and the
              animation runs on wall-clock with the latency slider, because
              their audio arrives via Discord's jitter buffer, not from here.
    ?light=1  cream background instead of dark.
    ?bare=1   face only, no caption or controls (for a clean screen share).
-->
<style>
  :root{
    --ink:#141413;      /* Claude near-black */
    --cream:#F0EEE6;    /* Claude cream    */
    --clay:#D97757;     /* Claude orange   */
    --bg:var(--ink); --fg:var(--clay); --text:var(--cream);
  }
  body.light{ --bg:var(--cream); --fg:var(--clay); --text:var(--ink); }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  #wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px}
  #screen{position:relative;line-height:0}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;
    width:min(92vw,880px);height:auto}
  #cap{max-width:min(92vw,880px);min-height:2.6em;text-align:center;font-size:15px;
    line-height:1.45;letter-spacing:.01em;opacity:.9}
  #cap.empty{opacity:.35}
  #cap{transition:opacity .9s ease}
  #cap.gone{opacity:0}
  #ctl{display:flex;gap:14px;align-items:center;font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;opacity:.5;transition:opacity .5s ease}
  #ctl.dim{opacity:0}
  #ctl.dim:hover{opacity:.85}
  #ctl button{font:inherit;letter-spacing:.1em;text-transform:uppercase;background:transparent;
    color:var(--text);border:1px solid currentColor;border-radius:4px;padding:5px 10px;cursor:pointer;opacity:.8}
  #ctl button:hover{opacity:1;border-color:var(--clay);color:var(--clay)}
  #ctl input[type=range]{width:110px;accent-color:var(--clay)}
  #gate{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;cursor:pointer;z-index:5}
  #gate b{color:var(--clay);font-size:13px;letter-spacing:.22em;text-transform:uppercase}
  #gate span{font-size:12px;opacity:.45;max-width:320px;text-align:center;line-height:1.6}
  .hide{display:none!important}
  #dot{position:absolute;top:10px;right:12px;width:9px;height:9px;border-radius:50%;
    background:var(--text);opacity:.18;transition:opacity .2s}
  #dot.live{background:var(--clay);opacity:1}
</style>
</head>
<body>
<div id="wrap">
  <div id="screen">
    <canvas id="c" width="64" height="48"></canvas>
    <div id="dot" title="stream connected"></div>
  </div>
  <div id="cap" class="empty">waiting for the draft</div>
  <div id="ctl">
    <button id="mute">audio on</button>
    <label id="offwrap" class="hide">delay <input id="off" type="range" min="0" max="1200" step="25" value="250"><span id="offv">250ms</span></label>
  </div>
</div>
<div id="gate">
  <b>the coach</b>
  <span>Click anywhere to allow audio. Browsers block sound until you do.</span>
</div>

<script>
const $ = (id) => document.getElementById(id);
const Q = new URLSearchParams(location.search);
if (Q.get("light") === "1") document.body.classList.add("light");
if (Q.get("bare") === "1") { $("cap").classList.add("hide"); $("ctl").classList.add("hide"); }

const W = 64, H = 48;
const cv = $("c"), cx = cv.getContext("2d");
const css = (n) => getComputedStyle(document.body).getPropertyValue(n).trim();

// #region drawing — everything snaps to the 64x48 grid
function px(x, y, w, h, colour) {
  cx.fillStyle = colour;
  cx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}
// Rasterise an ellipse onto the grid a row at a time. Drawing an arc() and
// letting the browser antialias it would defeat the whole point: the stair-step
// edge IS the look, so the shape has to be quantised before it is painted.
function ellipse(cxp, cyp, rx, ry, colour) {
  if (rx < 0.5) return;
  // A shut mouth still has to be a line. Below about one pixel of radius every
  // row of the ellipse rounds outside the shape and nothing at all gets drawn,
  // which reads as a face with no mouth rather than a closed one.
  if (ry < 1) { px(cxp - rx, cyp, Math.max(2, rx * 2), 2, colour); return; }
  cx.fillStyle = colour;
  const top = Math.round(cyp - ry), bot = Math.round(cyp + ry);
  for (let y = top; y <= bot; y++) {
    const dy = (y + 0.5 - cyp) / ry;
    if (Math.abs(dy) > 1) continue;
    const half = rx * Math.sqrt(1 - dy * dy);
    const x0 = Math.round(cxp - half), x1 = Math.round(cxp + half);
    if (x1 > x0) cx.fillRect(x0, y, x1 - x0, 1);
  }
}

// A stepped bar, because a three-pixel brow cannot be rotated: at this
// resolution the angle has to be built out of whole pixels. `rise` is signed
// toward the face centre and `dir` says which end is the inner one, so one value
// produces a mirrored pair instead of two parallel brows. Negative rise lifts
// the inner ends, which is the smug read; positive drops them, which is focus.
function brow(x, y, w, rise, dir, arch, colour) {
  const seg = Math.ceil(w / 3);
  for (let i = 0; i < 3; i++) {
    const k = dir > 0 ? i - 1 : 1 - i;
    // The middle third lifts, which is the only way to get an arch out of three
    // blocks. A raised brow that stays a flat bar reads as a floating dash.
    const bend = i === 1 ? -Math.round(arch) : 0;
    px(x + i * seg, y + Math.round(k * rise) + bend, Math.min(seg, w - i * seg), 3, colour);
  }
}

// The closed mouth, as a signed curve. Positive is a smirk: one end lifted in
// whole pixels with a tick above it, so it reads as a curve and not a staircase.
// Negative is a frown, which has to be symmetric with the middle raised, because
// an asymmetric frown reads as a smirk pointing the other way rather than as
// displeasure.
function restMouth(cxp, cy, w, curve, thick, colour) {
  const seg = Math.round(w / 3);
  const x0 = cxp - Math.round(w / 2);
  if (curve >= 0) {
    const rise = Math.round(curve * 2);
    px(x0, cy, seg, thick, colour);
    px(x0 + seg, cy - Math.min(1, rise), seg, thick, colour);
    px(x0 + 2 * seg, cy - rise, seg, thick, colour);
    if (rise > 0) px(x0 + 3 * seg - 1, cy - rise - 1, 2, 1, colour);
  } else {
    const arch = Math.round(-curve * 2);
    px(x0, cy, seg, thick, colour);
    px(x0 + seg, cy - arch, seg, thick, colour);
    px(x0 + 2 * seg, cy, seg, thick, colour);
    if (arch > 1) { px(x0 + seg - 1, cy - arch + 1, 1, arch, colour); px(x0 + 2 * seg, cy - arch + 1, 1, arch, colour); }
  }
}

let blink = 0;          // 0..1, 1 = fully shut
let openness = 0, wideness = 0.4;   // smoothed mouth state
let bob = 0;

// Expression channels. All of these are smoothed toward targets chosen by `mode`
// in tick(), never set directly, because an expression that snaps between states
// looks like a bug and an expression that eases looks like a decision.
let lid = 0.42;       // 0 = wide open, 1 = fully hooded
let browTilt = -0.7;  // negative lifts the inner ends (smug), positive drops them
let curve = 1;        // -1 frown .. +1 smirk, only visible when not talking
let browRaise = 1;    // pixels the LEFT brow sits above the right, the quizzical one
let mouthSkew = 0;    // pixels the resting mouth shifts sideways
let mouthPurse = 0;   // 0 = full width, 1 = bunched up short and thick
let gaze = 0;         // -1..1 horizontal pupil offset
let gazeTarget = 0;

function draw() {
  const bg = css("--bg"), fg = css("--fg");
  cx.fillStyle = bg; cx.fillRect(0, 0, W, H);

  const lift = openness * 2.2;                       // brows rise as the jaw drops
  const drift = Math.sin(bob) * 0.9;                 // slow idle sway, keeps it alive
  const oy = Math.round(drift + lift * 0.45);

  // Geometry in one place. Eyes sit closer together than feels right in the
  // abstract: pushed out toward the edges they stop reading as a face and start
  // reading as two separate objects. Brows are narrower than the eyes and keep a
  // clear gap above them, or they read as hats rather than brows.
  const EW = 11, EH = 11, EX_L = 15, EX_R = 38, ETOP = 13;

  // One brow higher than the other is most of what sells "unimpressed". It is
  // asymmetric on purpose; a matched pair reads as surprise instead.
  const browY = 8 - Math.round(lift) + oy;
  const rise = browTilt * 2;
  // Only the raised brow curves. Arching both would read as surprise; arching
  // the lifted one alone is what makes it quizzical.
  brow(EX_L + 1, browY - Math.round(browRaise), EW - 2, rise, 1, browRaise * 0.6, fg);
  brow(EX_R + 1, browY, EW - 2, rise, -1, 0, fg);

  // Eyes. The upper lid comes down and the lower edge stays put, which is what
  // makes a half-lidded eye look bored rather than merely small.
  const openFrac = (1 - blink) * (1 - 0.42 * lid);
  const eh = Math.max(1, Math.round(EH * openFrac));
  const ey = ETOP + (EH - eh) + oy;
  px(EX_L, ey, EW, eh, fg);
  px(EX_R, ey, EW, eh, fg);
  if (eh > 3) {
    // A wide shallow slit, not a square hole: a big square pupil turns the eye
    // into a socket. It slides with the gaze and is clamped so it cannot leave.
    const pw = 5, ph = Math.max(1, Math.round(eh * 0.30));
    const py = ey + Math.round((eh - ph) / 2);
    const slack = (EW - pw) / 2;
    const gx = Math.max(-slack, Math.min(slack, gaze * 2.4));
    px(EX_L + slack + gx, py, pw, ph, bg);
    px(EX_R + slack + gx, py, pw, ph, bg);
  }

  // Talking mouth from the envelope, resting mouth from the mood. Width comes
  // from wideness (fricatives wide and flat, back vowels round) and height from
  // loudness, pulled in when nearly shut so a quiet mouth is a short line.
  if (openness > 0.03) {
    const rx = (5.5 + wideness * 8.0) * (0.68 + 0.32 * Math.min(1, openness * 3));
    const ry = 0.5 + openness * 7.5;
    ellipse(32, 34 + oy, rx, ry, fg);
    // Dark cavity, only once the mouth is open enough to have one. It must stay
    // clear of the outer edge: an inner shape that degrades to the flat-line
    // case paints straight through the bottom lip and leaves a stray pixel.
    if (ry >= 4) ellipse(32, 34 + oy + ry * 0.15, rx * 0.5, ry * 0.35, bg);
  } else {
    // Pursing shortens the mouth AND thickens it, which is what "bunched up to
    // one side" actually looks like: a narrower line is just a smaller mouth.
    const restW = Math.round(17 - mouthPurse * 7);
    const restT = 2 + Math.round(mouthPurse);
    restMouth(32 + Math.round(mouthSkew), 34 + oy, restW, curve, restT, fg);
  }
}
// #endregion

// #region playback clock
let tl = null;          // {frames, frameMs, durationMs}
let audio = null;
let startedAt = 0;      // wall-clock start, used only in muted mode
let muted = Q.get("mute") === "1";
let offsetMs = Number($("off").value);

function frameAt(ms) {
  if (!tl) return null;
  const i = Math.floor(ms / tl.frameMs);
  if (i < 0) return { openness: 0, wideness: 0.4 };
  if (i >= tl.frames.length) return null;
  return tl.frames[i];
}

// Where each mood sits. Idle is deliberately smug: hooded eyes, one brow up, a
// smirk. It is a draft bot that thinks it has already won, and the resting face
// is the only place that comes across, since the mouth is busy the rest of the
// time.
// `ease` per mood on purpose: anger arrives fast and settles slowly, which is
// what makes a flash of it read as a reaction rather than a mood swing.
const MOODS = {
  //          eyelid  brow shape   mouth curve  brow raise  mouth skew  gaze   ease
  idle:     { lid: 0.42, browTilt: -0.70, curve:  1.00, browRaise: 1.0, mouthSkew:  0.0, mouthPurse: 0.00, gazeAmp: 1.00, ease: 0.05 },
  speaking: { lid: 0.05, browTilt: -0.20, curve:  0.00, browRaise: 0.5, mouthSkew:  0.0, mouthPurse: 0.00, gazeAmp: 0.45, ease: 0.07 },
  // Thinking gets its OWN vocabulary rather than a milder scowl. Dropping both
  // inner brow ends is the same gesture as anger, just less of it, so it read as
  // annoyance. One brow well up and the lips slanted and pushed off centre is
  // what actually reads as working something out.
  thinking: { lid: 0.34, browTilt: -0.15, curve:  0.80, browRaise: 3.0, mouthSkew: -4.0, mouthPurse: 1.00, gazeAmp: 0.80, ease: 0.07 },
  annoyed:  { lid: 0.30, browTilt:  1.00, curve: -0.50, browRaise: 0.0, mouthSkew:  0.0, mouthPurse: 0.25, gazeAmp: 0.30, ease: 0.14 },
  angry:    { lid: 0.10, browTilt:  1.45, curve: -1.00, browRaise: 0.0, mouthSkew:  0.0, mouthPurse: 0.00, gazeAmp: 0.15, ease: 0.22 },
  // Smugger than idle, which is already smug: the eyes narrow further rather
  // than widening, because a delighted squint is what separates "pleased with
  // myself" from merely "awake".
  pleased:  { lid: 0.62, browTilt: -1.15, curve:  1.00, browRaise: 1.5, mouthSkew:  0.0, mouthPurse: 0.00, gazeAmp: 0.25, ease: 0.10 },
};
const TRANSIENT = new Set(["angry", "annoyed", "pleased"]);
let mode = "idle";
let moodTimer = null;
let pendingMood = null;
let lineMood = null;   // expression worn for the duration of the current line

// A transient mood never interrupts a line. If the mouth is busy the mood waits
// and is applied the moment the line ends, which is what makes "pleased" work at
// all, since it is sent immediately after the pick line finishes in Discord and
// the page's own audio may still have a moment to run.
function setMood(name, holdMs) {
  clearTimeout(moodTimer);
  if (tl) { pendingMood = { name, holdMs }; return; }
  mode = name;
  moodTimer = setTimeout(() => { if (!tl) mode = "idle"; }, holdMs);
}

function tick() {
  bob += 0.02;
  let target = null;
  if (tl) {
    const ms = muted ? (performance.now() - startedAt - offsetMs)
                     : (audio ? audio.currentTime * 1000 : 0);
    target = frameAt(ms);
    if (!target) {
      tl = null;
      $("dot").classList.remove("live");
      // A mood it was wearing while talking lingers briefly afterwards, so it
      // finishes the sentence and then keeps glaring for a beat.
      if (pendingMood) { const pm = pendingMood; pendingMood = null; setMood(pm.name, pm.holdMs); }
      else if (lineMood) { const lm = lineMood; lineMood = null; setMood(lm, 3500); }
      else mode = "idle";
    }
  }
  const to = target ?? { openness: 0, wideness: 0.4 };
  // Smoothing at ~0.45 keeps 20ms frames from strobing at 60fps without
  // smearing consonants into each other.
  openness += (to.openness - openness) * 0.45;
  wideness += (to.wideness - wideness) * 0.25;

  // Expressions ease far more slowly than the mouth. 0.05 is about a second to
  // settle, which is roughly how long a face takes to change its mind.
  const m = MOODS[mode] ?? MOODS.idle;
  const e = m.ease;
  const curveTarget = mode === "idle" ? restCurve : m.curve;
  lid += (m.lid - lid) * e;
  browTilt += (m.browTilt - browTilt) * e;
  curve += (curveTarget - curve) * e;
  browRaise += (m.browRaise - browRaise) * e;
  mouthSkew += (m.mouthSkew - mouthSkew) * e;
  mouthPurse += (m.mouthPurse - mouthPurse) * e;
  gaze += (gazeTarget * m.gazeAmp - gaze) * 0.12;

  draw();
  requestAnimationFrame(tick);
}

// The resting mouth wanders between flat and a full smirk, on its own slow
// timer. A fixed resting expression is most of what makes an idle face look like
// a still image. Kept small and slow deliberately: a resting face that moves a
// lot reads as twitchy, not alive. Only idle drifts; a mood means something and
// should hold its shape.
let restCurve = 1;
(function scheduleRest() {
  const wait = 2600 + Math.random() * 4200;
  setTimeout(() => {
    const spots = [0.05, 0.3, 0.65, 1, 1];   // 1 twice: it settles back to smug
    let next = spots[Math.floor(Math.random() * spots.length)];
    if (Math.abs(next - restCurve) < 0.2) next = restCurve > 0.5 ? 0.1 : 1;
    restCurve = next;
    scheduleRest();
  }, wait);
})();

// Saccades, not a sine wave: eyes flick to a new spot and hold it. A smooth
// oscillation reads as a machine scanning, which is the opposite of relaxed.
(function scheduleGaze() {
  const wait = 900 + Math.random() * 2800;
  setTimeout(() => {
    const spots = [-1, -0.65, -0.3, 0, 0.3, 0.65, 1];
    let next = spots[Math.floor(Math.random() * spots.length)];
    if (Math.abs(next - gazeTarget) < 0.25) next = -next;  // always actually move
    gazeTarget = next;
    scheduleGaze();
  }, wait);
})();

// Blink on an irregular timer; a fixed interval looks mechanical.
(function scheduleBlink() {
  const wait = 2200 + Math.random() * 3600;
  setTimeout(() => {
    let t = 0;
    const iv = setInterval(() => {
      t += 16;
      blink = t < 90 ? t / 90 : Math.max(0, 1 - (t - 90) / 120);
      if (t > 210) { blink = 0; clearInterval(iv); }
    }, 16);
    scheduleBlink();
  }, wait);
})();
// #endregion

// #region stream
let capTimer = null;
// Captions fade out after 20s. A spoken line is over in seconds and leaving the
// text up makes the last thing it said look like the current thing it is saying.
function showCaption(text, dim) {
  clearTimeout(capTimer);
  const cap = $("cap");
  cap.classList.remove("gone");
  cap.textContent = text || "";
  cap.classList.toggle("empty", !text || dim === true);
  if (text) capTimer = setTimeout(() => cap.classList.add("gone"), 20_000);
}

function onSpeak(d) {
  tl = { frames: d.frames, frameMs: d.frameMs, durationMs: d.durationMs };
  startedAt = performance.now();
  // The mouth is driven by the envelope either way, so the mood only decides the
  // brows and the eyes. That is what lets it scowl through a whole sentence
  // without the lip sync changing at all.
  lineMood = TRANSIENT.has(d.mood) ? d.mood : null;
  clearTimeout(moodTimer);
  pendingMood = null;
  mode = lineMood ?? "speaking";
  showCaption(d.text || "", false);
  $("dot").classList.add("live");
  if (muted) return;
  if (audio) { audio.pause(); audio.src = ""; }
  audio = new Audio(d.url);
  audio.preload = "auto";
  // If audio will not play (blocked, or the clip has already been evicted),
  // fall back to the wall-clock so the face still talks rather than freezing.
  audio.play().catch(() => { muted = true; startedAt = performance.now(); });
}

function connect() {
  const es = new EventSource("/events");
  es.addEventListener("speak", (e) => { try { onSpeak(JSON.parse(e.data)); } catch (err) { console.error(err); } });
  es.addEventListener("state", (e) => {
    try {
      const d = JSON.parse(e.data);
      if (d.state === "thinking") { mode = "thinking"; showCaption(d.detail || "thinking", true); }
      if (TRANSIENT.has(d.state)) {
        setMood(d.state, d.state === "angry" ? 7000 : d.state === "pleased" ? 6000 : 5000);
        if (d.detail) { showCaption(d.detail, true); }
      }
      if (d.state === "idle" && !tl) { clearTimeout(moodTimer); pendingMood = null; mode = "idle"; }
    } catch (err) { console.error(err); }
  });
  es.onerror = () => { /* EventSource reconnects on its own; nothing to do */ };
}
// #endregion

// #region controls
$("mute").onclick = () => {
  muted = !muted;
  $("mute").textContent = muted ? "audio off" : "audio on";
  $("offwrap").classList.toggle("hide", !muted);
  if (muted && audio) { audio.pause(); }
};
$("off").oninput = () => { offsetMs = Number($("off").value); $("offv").textContent = offsetMs + "ms"; };
// Fade the controls out after 10s of no mouse movement and bring them back on
// any movement, so a screen share is just the face. Hovering the invisible strip
// also reveals it, which is why this is opacity and not display.
let hideTimer = null;
function armControlHide() {
  clearTimeout(hideTimer);
  $("ctl").classList.remove("dim");
  hideTimer = setTimeout(() => $("ctl").classList.add("dim"), 10_000);
}
addEventListener("mousemove", armControlHide, { passive: true });
addEventListener("touchstart", armControlHide, { passive: true });
armControlHide();

$("gate").onclick = () => {
  $("gate").classList.add("hide");
  // Unlock playback with a real (silent) play() inside the click handler.
  const a = new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAgD4AAAB9AAACABAAZGF0YQAAAAA=");
  a.play().catch(() => {});
  connect();
};
if (muted) { $("mute").textContent = "audio off"; $("offwrap").classList.remove("hide"); $("gate").classList.add("hide"); connect(); }
// #endregion

draw();                       // paint a face immediately, before any stream
requestAnimationFrame(tick);
</script>
</body>
</html>
