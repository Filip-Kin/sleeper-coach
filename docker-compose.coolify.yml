# Coolify deployment variant (build + run on the NAS via Coolify).
# The original docker-compose.yml is kept for plain-docker rollback.
# Differences: no fixed container_name (Coolify manages names). State + config
# already live at /data/sleeper-coach (outside ncdata) so the bind is unchanged.
# Secrets come from Coolify-managed env instead of env_file: /data/sleeper-coach/env.
services:
  sleeper-coach:
    build: .
    ports:
      - "127.0.0.1:8770:8770" # dashboard (Phase D)
      - "127.0.0.1:6081:6080" # noVNC (takeover view)
    volumes:
      - /data/sleeper-coach:/data/sleeper-coach
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  announcer:
    # The coach's face (src/announcer/face.ts). Bound on all interfaces so it
    # is reachable over the LAN and the tailnet for a screen share; the page is
    # read-only and the one write endpoint (/say) needs ANNOUNCER_API_KEY.
    environment:
      - FACE_PORT=8773
    ports:
      - "8773:8773"
    build:
      context: .
      dockerfile: Dockerfile.announcer
    volumes:
      - /data/sleeper-coach:/data/sleeper-coach:ro
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
