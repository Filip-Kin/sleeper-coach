# The ONLY compose file. Coolify (resource rl3nyhykcsaixibjci6xbqif on the NAS)
# builds and runs this on every push to main; see DEPLOY.md at the repo root.
# The plain docker-compose.yml that used to sit next to it was deleted on
# 2026-09-23: it pinned container_name sleeper-coach and the same 8770 port, so
# a `docker compose up` from the checkout collided with the Coolify container
# and put a second daemon on the same state volume. Rollback is a Coolify
# redeploy of an earlier SHA, not a hand-run compose.
# No container_name (Coolify manages names). State and config live on the bind
# at /data/sleeper-coach; secrets come from Coolify-managed env.
services:
  sleeper-coach:
    build: .
    ports:
      - "127.0.0.1:8770:8770" # dashboard (Phase D)
    volumes:
      - /data/sleeper-coach:/data/sleeper-coach
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  announcer:
    # The coach's face (src/announcer/face.ts). Bound on all interfaces so it
    # is reachable over the LAN and the tailnet for a screen share; the page is
    # read-only and the one write endpoint (/say) needs ANNOUNCER_API_KEY.
    environment:
      - FACE_PORT=8773
    ports:
      - "8773:8773"
    build:
      context: .
      dockerfile: Dockerfile.announcer
    volumes:
      - /data/sleeper-coach:/data/sleeper-coach:ro
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
